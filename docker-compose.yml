# Local PostgreSQL for development: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agastya
      POSTGRES_PASSWORD: agastya
      POSTGRES_DB: agastya
    ports:
      - "5432:5432"
    volumes:
      - agastya-pg:/var/lib/postgresql/data
volumes:
  agastya-pg:
